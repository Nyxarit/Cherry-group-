.bgshade{position:fixed;inset:0;z-index:-2;background:radial-gradient(ellipse at 50% 0%,rgba(224,32,63,.22),transparent 60%),linear-gradient(180deg,rgba(28,6,14,.28),rgba(28,6,14,.72))}
#petals{position:fixed;inset:0;z-index:-1;pointer-events:none}
a{color:inherit}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
:focus-visible{outline:2px solid var(--blossom);outline-offset:3px;border-radius:8px}

header{position:sticky;top:0;z-index:20;backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);background:rgba(20,5,11,.55);border-bottom:1px solid var(--line)}
.bar{max-width:1120px;margin:0 auto;padding:12px 20px;display:flex;align-items:center;justify-content:space-between;gap:16px}
.logo{display:flex;align-items:center;gap:10px;text-decoration:none;font-family:var(--head);font-weight:700;font-size:1.05rem;letter-spacing:.02em}
.logo .mark{width:36px;height:36px;border-radius:10px;flex:none;box-shadow:0 0 0 1px rgba(255,163,184,.35),0 6px 18px -6px var(--cherry)}
.em{-webkit-text-fill-color:initial}
nav{display:flex;gap:4px}
nav a{padding:8px 14px;border-radius:999px;text-decoration:none;font-size:.92rem;font-weight:600;color:var(--muted);transition:color .2s,background .2s}
nav a:hover{color:var(--text);background:rgba(255,163,184,.1)}
nav a.on{color:#fff;background:linear-gradient(135deg,var(--cherry),var(--deep));box-shadow:0 6px 20px -8px var(--cherry)}
.burger{display:none;width:42px;height:42px;border-radius:12px;border:1px solid var(--line);position:relative}
.burger i{position:absolute;left:11px;right:11px;height:2px;background:var(--text);border-radius:2px;transition:transform .3s,opacity .2s}
.burger i:nth-child(1){top:14px}.burger i:nth-child(2){top:20px}.burger i:nth-child(3){top:26px}
.burger.open i:nth-child(1){transform:translateY(6px) rotate(45deg)}
.burger.open i:nth-child(2){opacity:0}
.burger.open i:nth-child(3){transform:translateY(-6px) rotate(-45deg)}

main{max-width:1120px;margin:0 auto;padding:36px 20px 80px;min-height:78vh}
.view{animation:enter .55s cubic-bezier(.2,.8,.2,1) both}
.view.leave{animation:leave .22s ease both}
@keyframes enter{from{opacity:0;transform:translateY(18px);filter:blur(8px)}to{opacity:1;transform:none;filter:none}}
@keyframes leave{to{opacity:0;transform:translateY(-8px);filter:blur(6px)}}

.hero{padding:clamp(28px,7vw,84px) 0 40px;max-width:760px}
.hero h1{font-family:var(--head);font-weight:900;font-size:clamp(2.4rem,8.6vw,5rem);line-height:1.04;letter-spacing:-.02em;
  background:linear-gradient(180deg,#fff 0%,var(--blossom) 45%,var(--cherry) 100%);-webkit-background-clip:text;background-clip:text;color:transparent;
  filter:drop-shadow(0 8px 40px rgba(224,32,63,.55))}
.hero p{margin-top:20px;font-size:clamp(1rem,2.4vw,1.2rem);color:#f0d3da;max-width:560px}

.tiles{display:grid;grid-template-columns:repeat(2,1fr);gap:16px;margin-top:8px}
.tile{position:relative;display:block;text-decoration:none;padding:28px 26px 30px;border-radius:22px;background:var(--glass);border:1px solid var(--line);overflow:hidden;
  backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);transition:transform .35s cubic-bezier(.2,.8,.2,1),border-color .3s,box-shadow .35s}
.tile::before{content:"";position:absolute;inset:0;background:radial-gradient(360px circle at var(--mx,50%) var(--my,0%),rgba(224,32,63,.45),transparent 65%);opacity:0;transition:opacity .3s}
.tile:hover{transform:translateY(-5px);border-color:rgba(255,163,184,.5);box-shadow:0 24px 50px -22px var(--cherry)}
.tile:hover::before{opacity:1}
.tile:active{transform:scale(.98)}
.tile>*{position:relative}
.tile h3{font-family:var(--head);font-size:1.15rem;font-weight:700;line-height:1.3}
.tile p{margin-top:8px;color:var(--muted);font-size:.95rem}
.tile .go{margin-top:22px;display:inline-flex;align-items:center;gap:8px;font-weight:700;font-size:.9rem;color:var(--blossom)}
.tile .go svg{width:18px;height:18px;transition:transform .3s}
.tile:hover .go svg{transform:translateX(6px)}
.tiles .tile{animation:enter .7s cubic-bezier(.2,.8,.2,1) both}
.tiles .tile:nth-child(1){animation-delay:.15s}.tiles .tile:nth-child(2){animation-delay:.25s}
.tiles .tile:nth-child(3){animation-delay:.35s}.tiles .tile:nth-child(4){animation-delay:.45s}

.pagehead{margin-bottom:28px}
.back{display:inline-flex;align-items:center;gap:8px;text-decoration:none;color:var(--muted);font-weight:600;font-size:.92rem;padding:6px 12px 6px 6px;border-radius:999px;transition:color .2s,background .2s}
.back:hover{color:var(--text);background:rgba(255,163,184,.1)}
.back svg{width:20px;height:20px}
.pagehead h2{font-family:var(--head);font-weight:700;font-size:clamp(1.6rem,5vw,2.6rem);line-height:1.15;margin-top:14px}
.pagehead p{color:var(--muted);margin-top:10px;max-width:600px}

.acc{display:grid;gap:12px;max-width:820px}
.item{border-radius:18px;background:var(--glass);border:1px solid var(--line);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);transition:border-color .3s,box-shadow .3s}
.item.open{border-color:rgba(255,163,184,.45);box-shadow:0 18px 40px -24px var(--cherry)}
.item>button{width:100%;text-align:left;display:flex;justify-content:space-between;align-items:center;gap:14px;padding:18px 22px;font-weight:700;font-size:1.02rem}
.item>button .pl{flex:none;width:28px;height:28px;border-radius:50%;background:rgba(255,163,184,.12);position:relative;transition:background .3s,transform .35s}
.item>button .pl::before,.item>button .pl::after{content:"";position:absolute;left:8px;right:8px;top:13px;height:2px;background:var(--blossom);border-radius:2px;transition:transform .35s}
.item>button .pl::after{transform:rotate(90deg)}
.item.open .pl{background:var(--cherry);transform:rotate(180deg)}
.item.open .pl::before,.item.open .pl::after{background:#fff}
.item.open .pl::after{transform:rotate(0)}
.item .body{display:grid;grid-template-rows:0fr;transition:grid-template-rows .4s cubic-bezier(.2,.8,.2,1)}
.item.open .body{grid-template-rows:1fr}
.item .body>div{overflow:hidden}
.item .body ul{padding:0 22px 20px 44px;color:#efd6dc}
.item .body li{margin-top:6px}
.item .body li::marker{color:var(--cherry)}

.tgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:16px}
.tcard{position:relative;display:block;text-decoration:none;border-radius:20px;overflow:hidden;border:1px solid var(--line);background:var(--glass);transition:transform .35s cubic-bezier(.2,.8,.2,1),box-shadow .35s,border-color .3s}
.tcard:hover{transform:translateY(-6px);border-color:rgba(255,163,184,.5);box-shadow:0 26px 50px -22px var(--cherry)}
.tcard canvas{display:block;width:100%;aspect-ratio:3/2;object-fit:cover;transition:transform .6s cubic-bezier(.2,.8,.2,1)}
.tcard:hover canvas{transform:scale(1.06)}
.tcard .cv{overflow:hidden}
.tcard .ct{padding:16px 20px 20px}
.tcard h3{font-family:var(--head);font-size:1rem;font-weight:700}
.tcard p{color:var(--muted);font-size:.9rem;margin-top:4px}
.tcard.add{display:grid;place-items:center;min-height:210px;border-style:dashed;color:var(--muted);text-align:center;padding:20px;font-weight:600}

.detail{display:grid;grid-template-columns:minmax(0,1.05fr) minmax(0,1fr);gap:24px;align-items:start}
.shot{border-radius:22px;overflow:hidden;border:1px solid var(--line);box-shadow:0 30px 60px -30px #000,0 0 60px -20px var(--cherry)}
.shot canvas{display:block;width:100%;height:auto}
.panel{border-radius:22px;background:var(--glass);border:1px solid var(--line);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);padding:22px}
.nick{display:flex;flex-direction:column;gap:6px;margin-bottom:16px}
.nick label{font-size:.88rem;color:var(--muted);font-weight:600}
.nick input{font:inherit;color:var(--text);background:rgba(0,0,0,.35);border:1px solid var(--line);border-radius:12px;padding:11px 14px;transition:border-color .2s,box-shadow .2s}
.nick input:focus{outline:0;border-color:var(--cherry);box-shadow:0 0 0 3px rgba(224,32,63,.25)}
.tpl{white-space:pre-wrap;word-break:break-word;font-size:.95rem;line-height:1.65;background:rgba(0,0,0,.32);border:1px solid var(--line);border-radius:14px;padding:16px 18px;max-height:420px;overflow:auto}
.tpl mark{background:rgba(224,32,63,.3);color:#ffd0da;border-radius:5px;padding:0 4px}
.btns{display:flex;flex-wrap:wrap;gap:10px;margin-top:16px}
.btn{position:relative;display:inline-flex;align-items:center;gap:9px;padding:12px 20px;border-radius:14px;font-weight:700;font-size:.95rem;border:1px solid var(--line);background:rgba(255,163,184,.08);overflow:hidden;transition:transform .2s,background .25s,box-shadow .3s,border-color .25s}
.btn svg{width:18px;height:18px;flex:none}
.btn:hover{background:rgba(255,163,184,.16);border-color:rgba(255,163,184,.5)}
.btn:active{transform:scale(.96)}
.btn.main{background:linear-gradient(135deg,var(--cherry),var(--deep));border-color:transparent;box-shadow:0 12px 28px -12px var(--cherry)}
.btn.main:hover{box-shadow:0 16px 34px -10px var(--cherry);filter:brightness(1.1)}
.btn.done{background:#1c8a55;border-color:transparent}
.facts{margin-top:18px;padding-top:16px;border-top:1px solid var(--line)}
.facts h4{font-family:var(--head);font-size:.95rem;margin-bottom:8px}
.facts li{margin:6px 0 0 18px;color:#efd6dc;font-size:.95rem}
.facts li::marker{color:var(--cherry)}

.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:16px}
.card{padding:22px;border-radius:20px;background:var(--glass);border:1px solid var(--line);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px)}
.card h3{font-family:var(--head);font-size:1rem;margin-bottom:8px}
.card p{color:#efd6dc;font-size:.95rem}
.card a{color:var(--blossom);font-weight:600;word-break:break-all}

.item .body p{padding:0 22px 14px;color:#efd6dc}
.item .body p:last-child{padding-bottom:20px}
.item .body .ex{margin:0 22px 20px;padding:14px 16px;border-left:3px solid var(--cherry);background:rgba(0,0,0,.3);border-radius:0 12px 12px 0;white-space:pre-wrap;color:#f6e3e8;font-size:.95rem}
.item .body .ex+.btn,.item .body p+.btn{margin-top:2px}
.item .body a.btn{margin:0 22px 22px;text-decoration:none;width:fit-content}
.pen{color:#ff6b83;font-weight:700}
.gh{font-family:var(--head);font-size:1.15rem;font-weight:700;margin:38px 0 14px}
.pagehead+.gh{margin-top:0}
footer{border-top:1px solid var(--line);text-align:center;color:var(--muted);font-size:.88rem;padding:26px 20px 34px}

@media(max-width:820px){
  .detail{grid-template-columns:1fr}
  .burger{display:block}
  nav{position:absolute;top:100%;left:0;right:0;flex-direction:column;padding:10px 16px 16px;background:rgba(20,5,11,.94);border-bottom:1px solid var(--line);
    transform:translateY(-12px);opacity:0;pointer-events:none;transition:transform .3s,opacity .3s}
  nav.open{transform:none;opacity:1;pointer-events:auto}
  nav a{padding:13px 16px;font-size:1rem;border-radius:12px}
}
@media(max-width:560px){
  .logo{font-size:.92rem}
  .tiles{grid-template-columns:1fr}
  .tile{padding:22px 20px 24px}
  main{padding-top:20px}
  .btn{flex:1 1 calc(50% - 10px);justify-content:center;padding:12px 10px}
}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;transition-duration:.01ms!important;scroll-behavior:auto!important}#petals{display:none}}
</style>

const gameImg = new Image(); gameImg.src = GAME_IMG;
const gameReady = new Promise(r => { gameImg.complete ? r() : gameImg.onload = r; });
const bgImg = new Image(); bgImg.src = getComputedStyle(document.querySelector('.bg')).backgroundImage.slice(5,-2);
const imgReady = new Promise(r => { bgImg.complete ? r() : bgImg.onload = r; });
async function drawCover(cv, t){
  const kind = t.cover;
  await imgReady;
  try { await Promise.all([document.fonts.load('900 120px Unbounded'), document.fonts.load('600 30px Manrope')]); } catch(e){}
  const W = 1280, H = 853, sc = cv.dataset.small ? .4 : 1; cv.width = W * sc; cv.height = H * sc;
  const c = cv.getContext('2d'); c.scale(sc, sc);
  if (t.img) {
    const ok = await new Promise(r => { const im = new Image(); im.onload = () => { const s = Math.max(W / im.width, H / im.height), w = im.width * s, h = im.height * s; c.drawImage(im, (W - w) / 2, (H - h) / 2, w, h); r(true); }; im.onerror = () => r(false); im.src = t.img; });
    if (ok) return;
  }
  if (kind === 'game') { await gameReady; c.drawImage(gameImg, 0, 0, W, H); return; }
  c.drawImage(bgImg, 0, 0, W, H);
  const g = c.createRadialGradient(W/2, H/2, 40, W/2, H/2, 680);
  g.addColorStop(0, 'rgba(96,10,40,.62)'); g.addColorStop(1, 'rgba(96,10,40,0)');
  c.fillStyle = g; c.fillRect(0, 0, W, H);
  const b = c.createLinearGradient(0, H*.6, 0, H); b.addColorStop(0, 'rgba(50,4,22,0)'); b.addColorStop(1, 'rgba(50,4,22,.5)');
  c.fillStyle = b; c.fillRect(0, 0, W, H);
  c.textAlign = 'center'; c.textBaseline = 'middle';
  let size = 190; c.font = `900 ${size}px Unbounded, Arial Black, sans-serif`;
  while (c.measureText(kind).width > W - 160) { size -= 6; c.font = `900 ${size}px Unbounded, Arial Black, sans-serif`; }
  c.shadowColor = 'rgba(150,12,48,.95)'; c.shadowBlur = 50; c.fillStyle = '#fff'; c.fillText(kind, W/2, H/2 - 10);
  c.shadowBlur = 14; c.fillText(kind, W/2, H/2 - 10);
  c.shadowBlur = 0; c.fillStyle = '#fff'; c.font = '600 44px Manrope, Arial, sans-serif';
  c.fillText('BLACK RUSSIA CHERRY', W/2, H - 110);
}

/* ---- копирование / скачивание ---- */
async function copyText(t){
  try { await navigator.clipboard.writeText(t); return true; } catch(e){
    const a = document.createElement('textarea'); a.value = t; a.style.cssText = 'position:fixed;opacity:0';
    document.body.appendChild(a); a.select(); let ok = false; try { ok = document.execCommand('copy'); } catch(_){} a.remove(); return ok;
  }
}
function saveBlob(blob, name){ const u = URL.createObjectURL(blob), a = document.createElement('a'); a.href = u; a.download = name; document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(u), 1500); }
function flash(btn, txt){ const old = btn.innerHTML; btn.classList.add('done'); btn.innerHTML = txt; setTimeout(() => { btn.classList.remove('done'); btn.innerHTML = old; }, 1600); }
let NICK = '';

try {
  NICK = localStorage.getItem('cherry_nick') || '';
} catch (e) {}

function setNick(value) {
  NICK = value.trim();

  try {
    localStorage.setItem('cherry_nick', NICK);
  } catch (e) {}
}

function getNick() {
  return NICK;
}

const fmt = s => esc(s).replace(/\{\{(.+?)\}\}/g, '<b class="pen">$1</b>');
const accordion = groups => groups.map((g, gi) => (g.h ? `<h3 class="gh">${g.h}</h3>` : '') + `<div class="acc">${g.items.map((r, i) => `<div class="item${gi === 0 && i === 0 ? ' open' : ''}"><button aria-expanded="${gi === 0 && i === 0}"><span>${fmt(r.t)}</span><span class="pl"></span></button><div class="body"><div>${(r.p || []).map(x => `<p>${fmt(x)}</p>`).join('')}${r.q ? `<div class="ex">${esc(r.q)}</div>` : ''}${r.btn ? `<a class="btn main" href="${TABLE_URL || '#'}" target="_blank" rel="noopener"${TABLE_URL ? '' : ' data-empty'}>${r.btn}</a>` : ''}</div></div></div>`).join('')}</div>`).join('');

    <div class="tiles">${SECTIONS.map(s => `<a class="tile" href="#/${s.id}"><h3>${s.title}</h3><p>${s.desc}</p><span class="go">Открыть${arrow}</span></a>`).join('')}</div>`,
  rules: () => head(SECTIONS[0].title, SECTIONS[0].page, '#/') + accordion(RULES),
  group: () => head(SECTIONS[2].title, SECTIONS[2].page, '#/') + accordion(GROUP),
  info: () => head(SECTIONS[1].title, SECTIONS[1].page, '#/') + accordion(INFO) + `<h3 class="gh">Полезные ссылки</h3><div class="cards">${USEFUL.map(i => `<div class="card"><h3>${i.t}</h3><p>${i.p}<br><a href="${i.h}" target="_blank" rel="noopener">${i.a}</a></p></div>`).join('')}</div>`,
  templates: () => head(SECTIONS[3].title, SECTIONS[3].page, '#/') + `<div class="tgrid">${TEMPLATES.map(t => `<a class="tcard" href="#/templates/${t.id}"><div class="cv"><canvas data-tid="${t.id}" data-small="1"></canvas></div><div class="ct"><h3>${t.title}</h3><p>${t.desc}</p></div></a>`).join('')}</div>`,
  template: id => {
    const t = TEMPLATES.find(x => x.id === id); if (!t) return views.templates();
    return head(t.title, t.desc, '#/templates') + `<div class="detail">
      <div><div class="shot"><canvas id="shot"></canvas></div>
        <div class="btns"><button class="btn" id="dlImg">${imgIc}Скачать фото</button></div></div>
      <div class="panel">
        <div class="nick"><label for="nick">Твой ник (подставится вместо [Nick_Name])</label><input id="nick" placeholder="Например, Ivan_Cherry" value="${esc(NICK)}" autocomplete="off"></div>
        <div class="tpl" id="tpl"></div>
        ${t.facts ? `<div class="facts"><h4>Факты для поста</h4><ul>${t.facts.map(f => `<li>${esc(f)}</li>`).join('')}</ul></div>` : ''}
        <div class="btns"><button class="btn main" id="cp">${copyIc}Скопировать текст</button></div>
      </div></div>`;
  }
};
function fill(t) {
  return t.text.replace(/\[Nick_Name\]/g, NICK || '[Nick_Name]');
}
function bindTemplate(id){
  const t = TEMPLATES.find(x => x.id === id); if (!t) return;
  const box = $('#tpl'), draw = () => { box.innerHTML = esc(fill(t)).replace(/\[[^\]]+\]/g, m => `<mark>${m}</mark>`); };
  draw(); drawCover($('#shot'), t);
  $('#nick').oninput = e => {
  setNick(e.target.value);
  draw();
};
  $('#cp').onclick = async e => { const b = e.currentTarget; flash(b, (await copyText(fill(t))) ? 'Скопировано' : 'Не удалось скопировать'); };
  $('#dlImg').onclick = e => { const b = e.currentTarget; try { $('#shot').toBlob(bl => { if (bl) { saveBlob(bl, `cherry-${t.id}.png`); flash(b, 'Скачано'); } }, 'image/png'); } catch (err) { if (t.img) { const a = document.createElement('a'); a.href = t.img; a.download = `cherry-${t.id}`; a.click(); flash(b, 'Скачано'); } } };
}

/* ---- роутер ---- */
let current = null;
function render(){
  const parts = (location.hash.replace(/^#\/?/, '') || '').split('/');
  const key = parts.join('/');
  if (key === current) return; current = key;
  const html = parts[0] === '' ? views.home() : parts[0] === 'templates' && parts[1] ? views.template(parts[1]) : (views[parts[0]] || views.home)();
  nav.querySelectorAll('a').forEach(a => a.classList.toggle('on', a.dataset.id === parts[0]));
  nav.classList.remove('open'); $('#burger').classList.remove('open');
  const swap = () => {
    app.innerHTML = `<div class="view">${html}</div>`; window.scrollTo(0, 0);
    app.querySelectorAll('.item > button').forEach(b => b.onclick = () => { const it = b.parentElement, o = it.classList.toggle('open'); b.setAttribute('aria-expanded', o); });
    app.querySelectorAll('canvas[data-tid]').forEach(c => drawCover(c, TEMPLATES.find(x => x.id === c.dataset.tid)));
    app.querySelectorAll('[data-empty]').forEach(a => a.onclick = e => { e.preventDefault(); flash(a, 'Ссылка на таблицу ещё не добавлена'); });
    app.querySelectorAll('.tile').forEach(t => t.addEventListener('pointermove', e => { const r = t.getBoundingClientRect(); t.style.setProperty('--mx', (e.clientX - r.left) + 'px'); t.style.setProperty('--my', (e.clientY - r.top) + 'px'); }));
    if (parts[0] === 'templates' && parts[1]) bindTemplate(parts[1]);
  };
  const old = app.firstElementChild;
  if (old) { old.classList.add('leave'); setTimeout(swap, 200); } else swap();
}
window.addEventListener('hashchange', render); render();

/* ---- лепестки на фоне ---- */
(function(){
  const cv = $('#petals'), c = cv.getContext('2d'); let W, H, P = [];
  const size = () => { W = cv.width = innerWidth; H = cv.height = innerHeight; };
  size(); addEventListener('resize', size);
  const n = innerWidth < 700 ? 14 : 26;
  for (let i = 0; i < n; i++) P.push({x:Math.random()*W, y:Math.random()*H, r:4+Math.random()*7, v:.25+Math.random()*.55, s:Math.random()*Math.PI*2, w:.008+Math.random()*.012, a:.25+Math.random()*.35});
  (function loop(){
    c.clearRect(0, 0, W, H);
    for (const p of P) {
      p.y += p.v; p.s += p.w; p.x += Math.sin(p.s) * .6 + .15;
      if (p.y > H + 20) { p.y = -20; p.x = Math.random() * W; }
      if (p.x > W + 20) p.x = -20;
      c.save(); c.translate(p.x, p.y); c.rotate(p.s * 2); c.globalAlpha = p.a;
      c.fillStyle = '#ffa3b8'; c.beginPath(); c.ellipse(0, 0, p.r, p.r * .55, 0, 0, 7); c.fill(); c.restore();
    }
    requestAnimationFrame(loop);
  })();
})();
</script>
</body>
</html>
